server {
  # If you set PORT=10000 in Render env, keep this:
  listen ${PORT};
  # If you decided to use port 80 in the service settings instead, you can do:
  # listen 80;

  server_name _;

  root /var/www/html;

  # Put index.html BEFORE index.php so HTML is preferred
  index index.html index.php;

  # Root → always try a real file first, else fallback to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only route real .php files to PHP-FPM (port 9000 in this image)
  location ~ \.php$ {
    include        fastcgi_params;
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }

  # Just in case
  location ~ /\.ht {
    deny all;
  }
}