server {
  # Recommended on Render: bind to the env var port
  listen ${PORT};
  # If you prefer hardcoding 80 instead, change to: listen 80;

  server_name _;

  root /var/www/html;

  # Prefer index.html over index.php
  index index.html index.php;

  # For / and any non‑matching path, serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Send only real .php files to PHP‑FPM (TCP 9000 in this image)
  location ~ \.php$ {
    include        fastcgi_params;
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }

  location ~ /\.ht {
    deny all;
  }
}